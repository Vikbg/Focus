name: Dependency security

on:
  push:
    branches:
      - "main"
      - "agent/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "crates/**/Cargo.toml"
      - "bins/**/Cargo.toml"
      - "platform/**/Cargo.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/**/package.json"
      - ".github/workflows/dependency-security.yml"
      - "scripts/check-ci-reproducibility.py"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "crates/**/Cargo.toml"
      - "bins/**/Cargo.toml"
      - "platform/**/Cargo.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/**/package.json"
      - ".github/workflows/dependency-security.yml"
      - "scripts/check-ci-reproducibility.py"

permissions:
  contents: read

jobs:
  rust-advisories:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked --debug

      - name: Audit Rust advisories
        run: cargo audit

  rust-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked --debug

      - name: Check Rust dependency policy
        run: cargo deny check

  javascript-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high
