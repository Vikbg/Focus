name: Inline Task 6 Replay

on:
  push:
    branches:
      - agent/audit-remediation-inline

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-remediation-inline
          fetch-depth: 0
      - name: Apply replay persistence
        run: |
          python3 .inline-task6-replay.py
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/focus-protocol/src/lib.rs crates/focus-storage/src/lib.rs
          git commit -m "fix: persist at-most-once mutation reservations"
          git push origin HEAD:agent/audit-remediation-inline
