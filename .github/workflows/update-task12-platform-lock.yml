name: Update Task 12 platform lockfile

on:
  push:
    branches:
      - "agent/p2-process-inline"

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Update Cargo lockfile
        run: cargo check --workspace --all-targets

      - name: Verify lockfile change is minimal
        run: |
          python3 - <<'PY'
          import subprocess

          diff = subprocess.check_output(
              ["git", "diff", "--", "Cargo.lock"], text=True
          )
          added = [line for line in diff.splitlines() if line.startswith("+") and not line.startswith("+++")]
          removed = [line for line in diff.splitlines() if line.startswith("-") and not line.startswith("---")]
          if removed:
              raise SystemExit(f"unexpected Cargo.lock removals: {removed}")
          if added != ['+dependencies = [', '+ "focus-core",', '+]']:
              raise SystemExit(f"unexpected Cargo.lock additions: {added}")
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/update-task12-platform-lock.yml

      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/update-task12-platform-lock.yml
          git commit -m "chore: lock focus-platform core dependency"
          git push
