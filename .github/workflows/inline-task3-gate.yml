name: Inline Task 3 Gate

on:
  push:
    branches:
      - agent/audit-remediation-inline

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/audit-remediation-inline
          fetch-depth: 0
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Verify Task 3
        run: |
          cargo test --workspace
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          pnpm install --no-frozen-lockfile
          pnpm -r typecheck
          python3 scripts/check-no-em-dash.py
      - name: Write verification marker
        run: |
          mkdir -p .inline-verification
          printf '%s\n' "task3-green" > .inline-verification/task3-green.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .inline-verification/task3-green.txt
          git commit -m "test: attest task3 verification"
          git push origin HEAD:agent/audit-remediation-inline
