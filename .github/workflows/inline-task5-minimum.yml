name: Inline Task 5 Minimum

on:
  push:
    branches:
      - agent/audit-remediation-inline

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-remediation-inline
          fetch-depth: 0
      - name: Apply module export
        run: |
          python3 .inline-task5-minimum.py
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bins/focusd/src/lib.rs
          git commit -m "refactor: expose daemon service authority"
          git push origin HEAD:agent/audit-remediation-inline
