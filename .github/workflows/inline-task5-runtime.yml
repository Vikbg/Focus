name: Inline Task 5 Runtime

on:
  push:
    branches:
      - agent/audit-remediation-inline

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-remediation-inline
          fetch-depth: 0
      - name: Export runtime module
        run: |
          python3 -c 'from pathlib import Path; p=Path("bins/focusd/src/lib.rs"); t=p.read_text(); old="mod linux_emergency;\nmod service;\n\npub use service::{DaemonService, DaemonSnapshot, ProtectionHealth};\n"; new="mod linux_emergency;\nmod runtime;\nmod service;\n\npub use runtime::DaemonRuntime;\npub use service::{DaemonService, DaemonSnapshot, ProtectionHealth};\n"; assert old in t; p.write_text(t.replace(old,new,1))'
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bins/focusd/src/lib.rs bins/focusd/src/runtime.rs bins/focusd/src/service.rs bins/focusd/src/main.rs
          git commit -m "refactor: wire live daemon runtime"
          git push origin HEAD:agent/audit-remediation-inline
