name: Cgroup classes live

on:
  push:
    branches:
      - "main"
      - "agent/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/focus-platform/**"
      - "platform/linux/**"
      - ".github/workflows/cgroup-classes-live.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/focus-platform/**"
      - "platform/linux/**"
      - ".github/workflows/cgroup-classes-live.yml"

permissions:
  contents: read

concurrency:
  group: cgroup-classes-live-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  task26-cgroup-classes-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify disposable VM runner
        run: systemd-detect-virt --vm

      - name: Verify writable cgroup v2
        run: |
          test -f /sys/fs/cgroup/cgroup.controllers
          test "$(findmnt -n -o FSTYPE /sys/fs/cgroup)" = "cgroup2"
          sudo test -w /sys/fs/cgroup

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run Task 26 cgroup classes live gate
        run: |
          sudo env \
            "PATH=$PATH" \
            "RUSTUP_HOME=$HOME/.rustup" \
            "CARGO_HOME=$HOME/.cargo" \
            FOCUS_VM_SCENARIO=cgroup-classes-live \
            cargo test \
              --locked \
              -p focus-linux \
              --test cgroup_classes_live \
              -- \
              --ignored \
              --nocapture
