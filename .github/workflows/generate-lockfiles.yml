name: Generate lockfiles

on:
  push:
    branches:
      - "agent/audit-remediation-inline"
    paths:
      - ".github/workflows/generate-lockfiles.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/audit-remediation-inline
          fetch-depth: 0

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Generate pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Cargo.lock pnpm-lock.yaml
          git status --short
          if git diff --cached --quiet; then
            echo "lockfiles were generated but not staged"
            exit 1
          fi
          git commit -m "build: lock workspace dependencies"
          git push origin HEAD:agent/audit-remediation-inline
