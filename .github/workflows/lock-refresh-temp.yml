name: Temporary Cargo lock refresh

on:
  push:
    branches:
      - "agent/p3-ebpf-inline"
    paths:
      - "platform/linux/Cargo.toml"
      - ".github/workflows/lock-refresh-temp.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Generate and print lockfile
        run: |
          cargo generate-lockfile
          echo "FOCUS_LOCK_B64_BEGIN"
          base64 -w0 Cargo.lock
          echo
          echo "FOCUS_LOCK_B64_END"
