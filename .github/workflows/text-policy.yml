name: Text policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  no-em-dash:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reject forbidden punctuation
        run: python3 scripts/check-no-em-dash.py

      - name: Check CI reproducibility policy
        run: python3 scripts/check-ci-reproducibility.py
