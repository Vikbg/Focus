name: Foundation

on:
  push:
    branches:
      - "main"
      - "agent/**"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "bins/**"
      - "platform/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reject forbidden punctuation
        run: python3 scripts/check-no-em-dash.py

      - name: Check CI reproducibility policy
        run: python3 scripts/check-ci-reproducibility.py

      - name: Validate disposable Linux VM harness
        run: |
          bash -n tests/vm/run-qemu.sh
          bash -n tests/vm/guest-runner.sh
          python3 tests/vm/check_harness.py

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Temporary emit refreshed Cargo lockfile
        run: |
          cargo generate-lockfile
          echo "FOCUS_LOCK_B64_BEGIN"
          base64 -w0 Cargo.lock
          echo
          echo "FOCUS_LOCK_B64_END"

      - name: Temporary upload refreshed Cargo lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --locked

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Prove Cargo lock enforcement
        run: bash scripts/check-lock-enforcement.sh

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint JavaScript workspaces
        run: pnpm -r lint

      - name: Typecheck JavaScript workspaces
        run: pnpm -r typecheck

      - name: Test JavaScript workspaces
        run: pnpm -r test
