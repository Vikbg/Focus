name: Diagnose Task 12 Clippy

on:
  push:
    branches:
      - "agent/p2-process-inline"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Capture Clippy diagnostic
        id: clippy
        continue-on-error: true
        run: |
          set +e
          cargo clippy --workspace --all-targets --locked -- -D warnings > /tmp/clippy.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -ne 0 ]]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/clippy.log').read_text(encoding='utf-8', errors='replace').splitlines()
          tail = '\n'.join(lines[-40:])
          tail = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error::{tail}')
          PY
          fi

      - name: Remove diagnostic workflow
        if: always()
        run: rm .github/workflows/diagnose-task12-clippy.yml

      - name: Commit diagnostic cleanup
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/diagnose-task12-clippy.yml
          git commit -m "chore: remove Task 12 Clippy diagnostic"
          git push

      - name: Preserve Clippy failure status
        if: steps.clippy.outputs.status != '0'
        run: exit 1
