name: eBPF egress live

on:
  push:
    branches:
      - "main"
      - "agent/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "platform/linux/**"
      - ".github/workflows/ebpf-egress-live.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "platform/linux/**"
      - ".github/workflows/ebpf-egress-live.yml"

permissions:
  contents: read

concurrency:
  group: ebpf-egress-live-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  task27-ebpf-egress-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify disposable VM runner
        run: systemd-detect-virt --vm

      - name: Ensure network probe fixture is available
        run: |
          if ! command -v nc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes netcat-openbsd
          fi
          test -x /usr/bin/nc
          nc -h 2>&1 | head -n 1

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install pinned Rust nightly with eBPF sources
        run: rustup toolchain install nightly-2026-08-19 --profile minimal --component rust-src

      - name: Install pinned bpf-linker release
        run: |
          curl \
            --fail \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            --output /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          echo "10f62ba9ab7e544d538370552660efcb4f1a19153d5752bbf0f6b51f3bada450  /tmp/bpf-linker.tar.zst" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xpf /tmp/bpf-linker.tar.zst -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bpf-linker" --version

      - name: Build locked standalone eBPF crate
        working-directory: platform/linux/ebpf/focus-egress-ebpf
        env:
          RUSTFLAGS: -C linker=bpf-linker
        run: |
          cargo +nightly-2026-08-19 build \
            -Z build-std=core \
            --target bpfel-unknown-none \
            --release \
            --locked

      - name: Install exact production eBPF object
        run: |
          sudo install -d -o root -g root -m 0755 /usr/lib/focus
          sudo install \
            -o root \
            -g root \
            -m 0644 \
            platform/linux/ebpf/focus-egress-ebpf/target/bpfel-unknown-none/release/focus-egress-ebpf \
            /usr/lib/focus/focus-egress-ebpf.o
          test ! -L /usr/lib/focus/focus-egress-ebpf.o
          test "$(stat -c %u /usr/lib/focus/focus-egress-ebpf.o)" = "0"
          test "$(stat -c %a /usr/lib/focus/focus-egress-ebpf.o)" = "644"

      - name: Run Task 27 per-class eBPF egress live gate
        run: |
          sudo env \
            "PATH=$PATH" \
            "RUSTUP_HOME=$HOME/.rustup" \
            "CARGO_HOME=$HOME/.cargo" \
            FOCUS_VM_SCENARIO=ebpf-egress-live \
            cargo test \
              --locked \
              -p focus-linux \
              --test ebpf_egress_live \
              -- \
              --ignored \
              --nocapture
