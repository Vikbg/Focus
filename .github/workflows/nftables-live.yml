name: Nftables live

on:
  push:
    branches:
      - "main"
      - "agent/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/focus-platform/**"
      - "platform/linux/**"
      - ".github/workflows/nftables-live.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/focus-platform/**"
      - "platform/linux/**"
      - ".github/workflows/nftables-live.yml"

permissions:
  contents: read

concurrency:
  group: nftables-live-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  task24-nftables-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify disposable VM runner
        run: systemd-detect-virt --vm

      - name: Ensure nftables is available
        run: |
          if ! command -v nft >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes nftables
          fi
          nft --version

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run Task 24 nftables live gate
        run: |
          sudo env \
            "PATH=$PATH" \
            "RUSTUP_HOME=$HOME/.rustup" \
            "CARGO_HOME=$HOME/.cargo" \
            FOCUS_VM_SCENARIO=nftables-live \
            cargo test \
              --locked \
              -p focus-linux \
              --test nftables_live \
              -- \
              --ignored \
              --nocapture
