name: Apply safe socket cleanup

on:
  push:
    branches:
      - "agent/audit-remediation-inline"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Apply exact cleanup patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("bins/focusd/src/runtime.rs")
          text = path.read_text(encoding="utf-8")

          marker = '''fn snapshot_state(snapshot: &Arc<RwLock<DaemonSnapshot>>) -> crate::DaemonState {
              snapshot
                  .read()
                  .unwrap_or_else(std::sync::PoisonError::into_inner)
                  .state()
          }
          '''.replace("          ", "")

          helper = '''fn snapshot_state(snapshot: &Arc<RwLock<DaemonSnapshot>>) -> crate::DaemonState {
              snapshot
                  .read()
                  .unwrap_or_else(std::sync::PoisonError::into_inner)
                  .state()
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          struct SocketIdentity {
              device: u64,
              inode: u64,
          }

          impl SocketIdentity {
              fn capture(path: &Path) -> io::Result<Self> {
                  use std::os::unix::fs::{FileTypeExt, MetadataExt};

                  let metadata = fs::symlink_metadata(path)?;
                  if !metadata.file_type().is_socket() {
                      return Err(io::Error::new(
                          io::ErrorKind::InvalidData,
                          "bound IPC path is not a Unix socket",
                      ));
                  }
                  Ok(Self {
                      device: metadata.dev(),
                      inode: metadata.ino(),
                  })
              }

              fn remove_if_unchanged(self, path: &Path) -> io::Result<()> {
                  use std::os::unix::fs::{FileTypeExt, MetadataExt};

                  let metadata = match fs::symlink_metadata(path) {
                      Ok(metadata) => metadata,
                      Err(error) if error.kind() == io::ErrorKind::NotFound => return Ok(()),
                      Err(error) => return Err(error),
                  };

                  if metadata.file_type().is_socket()
                      && metadata.dev() == self.device
                      && metadata.ino() == self.inode
                  {
                      fs::remove_file(path)?;
                  }
                  Ok(())
              }
          }
          '''.replace("          ", "")

          if text.count(marker) != 1:
              raise SystemExit("unexpected snapshot_state body")
          text = text.replace(marker, helper, 1)

          old_bind = '''        let listener = bind_production_socket(socket_path, policy)?;
                  listener.set_nonblocking(true)?;
          '''.replace("          ", "")
          new_bind = '''        let listener = bind_production_socket(socket_path, policy)?;
                  let socket_identity = SocketIdentity::capture(socket_path)?;
                  listener.set_nonblocking(true)?;
          '''.replace("          ", "")
          if text.count(old_bind) != 1:
              raise SystemExit("unexpected runtime bind sequence")
          text = text.replace(old_bind, new_bind, 1)

          old_cleanup = '''        drop(listener);
                  while connections.join_next().await.is_some() {}
                  let _ = fs::remove_file(socket_path);
                  Ok(())
          '''.replace("          ", "")
          new_cleanup = '''        drop(listener);
                  while connections.join_next().await.is_some() {}
                  socket_identity.remove_if_unchanged(socket_path)?;
                  Ok(())
          '''.replace("          ", "")
          if text.count(old_cleanup) != 1:
              raise SystemExit("unexpected runtime cleanup sequence")
          text = text.replace(old_cleanup, new_cleanup, 1)

          path.write_text(text, encoding="utf-8")
          PY

          cargo fmt --all
          rm .github/workflows/apply-safe-socket-cleanup.yml

      - name: Commit safe cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bins/focusd/src/lib.rs bins/focusd/src/runtime.rs bins/focusd/tests/peer_auth.rs bins/focusd/tests/runtime_concurrency.rs .github/workflows/apply-safe-socket-cleanup.yml
          git commit -m "fix: clean up only owned daemon socket"
          git push
