name: Inline Task 3 Cleanup

on:
  push:
    branches:
      - agent/audit-remediation-inline

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/audit-remediation-inline
          fetch-depth: 0
      - name: Remove temporary inline verification files
        run: |
          test -f .inline-verification/task3-green.txt
          git rm .inline-verification/task3-green.txt
          git rm .github/workflows/inline-task3-gate.yml
          git rm .github/workflows/inline-task3-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary task3 verification files"
          git push origin HEAD:agent/audit-remediation-inline
