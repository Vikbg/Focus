name: Fix Task 12 policy schema persistence

on:
  push:
    branches:
      - "agent/p2-process-inline"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Persist the snapshot schema version exactly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/focus-storage/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old_import = '''    BootId, EmergencyRequest, EmergencyTimingState, PolicyVersion, ProfileId, RecoveryCodeHash,\n    SESSION_POLICY_SCHEMA_VERSION, SessionId, SessionPolicySnapshot, SessionState,\n    ValidatedTransition,\n'''
          new_import = '''    BootId, EmergencyRequest, EmergencyTimingState, PolicyVersion, ProfileId, RecoveryCodeHash,\n    SessionId, SessionPolicySnapshot, SessionState, ValidatedTransition,\n'''
          if text.count(old_import) != 1:
              raise SystemExit("unexpected focus-storage imports")
          text = text.replace(old_import, new_import, 1)

          old = '''                i64::from(SESSION_POLICY_SCHEMA_VERSION),\n'''
          new = '''                i64::from(session.policy_snapshot().schema_version()),\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected policy schema persistence site")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify storage package
        run: |
          cargo fmt --all
          cargo test -p focus-storage --locked
          cargo clippy -p focus-storage --all-targets --locked -- -D warnings

      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-task12-policy-schema-persistence.yml

      - name: Commit verified storage fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/focus-storage/src/lib.rs .github/workflows/fix-task12-policy-schema-persistence.yml
          git commit -m "fix(storage): persist exact policy schema version"
          git push
