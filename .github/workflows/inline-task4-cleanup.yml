name: Inline Task 4 Cleanup

on:
  push:
    branches:
      - agent/audit-remediation-inline

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-remediation-inline
          fetch-depth: 0
      - name: Remove temporary Task 4 helpers after a green gate
        run: |
          test -f .inline-verification/task4-green.txt
          git rm .inline-verification/task4-green.txt
          git rm .github/workflows/inline-task4-apply.yml
          git rm .github/workflows/inline-task4-gate.yml
          git rm .github/workflows/inline-task4-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary task4 verification files"
          git push origin HEAD:agent/audit-remediation-inline
